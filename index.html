<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicine Reminder App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>ঔষধ রিমাইন্ডার</h1>
        
        <div class="input-section">
            <input type="text" id="medName" placeholder="ঔষধের নাম লিখুন...">
            <input type="time" id="medTime">
            <button onclick="addReminder()">যোগ করুন</button>
        </div>

        <div class="list-section">
            <ul id="reminderList"></ul>
        </div>
    </div>

    <audio id="alarmSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
